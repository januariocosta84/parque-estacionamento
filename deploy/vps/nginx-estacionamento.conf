# nginx sites for a shared server (docs/DEPLOY.md "Shared server").
# Install: cp to /etc/nginx/sites-available/estacionamento, link into sites-enabled,
# nginx -t && systemctl reload nginx, then: certbot --nginx -d <both names>  (adds HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name estacionamento-api.timorstore.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name estacionamento.timorstore.com;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
