name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: estacionamento
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: estacionamento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estacionamento"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database integration tests always run in CI (they are skipped locally without a DB).
      DATABASE_URL_TEST: postgresql://estacionamento:ci-only-password@localhost:5432/estacionamento_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # End to end (M8): the phone's offline code against the built API on a real PostgreSQL —
      # sign in, go offline, issue and close tickets, come back online, sync exactly once.
      - name: Seed test database with a dev agent
        run: pnpm --filter @estacionamento/api db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          SEED_ADMIN_PASSWORD: ci-only-admin-password
          SEED_DEV_AGENT_PIN: '246810'
      - name: Start the built API
        run: node apps/api/dist/server.js > api.log 2>&1 &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          API_PORT: '3003'
      - name: Wait for the API
        run: for i in $(seq 1 30); do curl -sf localhost:3003/health && exit 0; sleep 1; done; exit 1
      - name: End-to-end test (offline → online)
        run: pnpm --filter @estacionamento/agent exec vitest run test/e2e.test.ts
        env:
          AGENT_E2E_API_URL: http://localhost:3003
          AGENT_E2E_AGENT: AMD-001
          AGENT_E2E_PIN: '246810'
      - name: API log
        if: failure()
        run: cat api.log
